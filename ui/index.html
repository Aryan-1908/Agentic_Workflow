<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copilot Scenario Runner</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a18; --muted: #6b6b66;
    --line: #e4e4e0; --accent: #2d5f4f; --ok: #1f7a4d; --bad: #b3261e;
    --warn: #8a6d1f; --chip: #f2f2ef;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a; --panel: #1e1e23; --ink: #ececea; --muted: #9a9a95;
      --line: #32323a; --accent: #6fbf9c; --ok: #4fc98a; --bad: #ff8a80;
      --warn: #d9b760; --chip: #26262c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16161a; --panel: #1e1e23; --ink: #ececea; --muted: #9a9a95;
    --line: #32323a; --accent: #6fbf9c; --ok: #4fc98a; --bad: #ff8a80;
    --warn: #d9b760; --chip: #26262c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 20px 16px 14px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .wrap { max-width: 1140px; margin: 0 auto; padding: 0 16px; }
  h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13.5px; }
  main { display: grid; grid-template-columns: 330px 1fr; gap: 20px; padding: 20px 0 48px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .card h2 {
    margin: 0; padding: 12px 14px; font-size: 12px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line);
  }
  .list { max-height: 72vh; overflow-y: auto; }
  .item {
    padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: block; width: 100%; text-align: left; background: none; border-left: 3px solid transparent;
    color: inherit; font: inherit;
  }
  .item:hover { background: var(--chip); }
  .item[aria-current="true"] { border-left-color: var(--accent); background: var(--chip); }
  .item .nm { font-weight: 600; font-size: 14px; }
  .item .ds { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .uc {
    display: inline-block; font-family: var(--mono); font-size: 10.5px;
    background: var(--chip); border: 1px solid var(--line); border-radius: 4px;
    padding: 0 5px; margin-left: 6px; color: var(--muted);
  }
  .pane { padding: 16px; min-height: 240px; }
  .empty { color: var(--muted); padding: 48px 16px; text-align: center; }

  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  button.run {
    background: var(--accent); color: #fff; border: 0; border-radius: 7px;
    padding: 9px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.run:disabled { opacity: .5; cursor: default; }
  :root[data-theme="dark"] button.run,
  :root:not([data-theme="light"]) button.run { color: #10231c; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) button.run { color: #fff; } }

  .verdict { font-weight: 700; font-size: 15px; }
  .verdict.pass { color: var(--ok); } .verdict.fail { color: var(--bad); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 10px; }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
  td.m { font-family: var(--mono); font-size: 12.5px; }
  .tick { color: var(--ok); font-weight: 700; } .cross { color: var(--bad); font-weight: 700; }

  .lane { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 4px;
          border: 1px solid var(--line); background: var(--chip); }
  .lane.auto { color: var(--ok); } .lane.approval { color: var(--warn); } .lane.escalate { color: var(--bad); }

  .steps { margin: 14px 0 0; padding: 0; list-style: none; font-size: 13.5px; }
  .steps li { padding: 6px 0 6px 20px; position: relative; border-bottom: 1px solid var(--line); }
  .steps li::before { content: "→"; position: absolute; left: 0; color: var(--muted); }
  .steps b { font-weight: 600; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
  .err { color: var(--bad); font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; }
  .traps { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .trap { font-size: 12px; padding: 3px 9px; border-radius: 5px; border: 1px solid var(--line); background: var(--chip); }
  .tabs { display: flex; gap: 6px; margin-top: 12px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
         padding: 7px 2px; margin-right: 18px; font: inherit; font-size: 14px; cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .ms { border: 1px solid var(--line); border-radius: 9px; margin-bottom: 14px; overflow: hidden; }
  .ms > summary { padding: 12px 14px; cursor: pointer; display: flex; align-items: baseline;
                  gap: 10px; background: var(--chip); list-style: none; }
  .ms > summary::-webkit-details-marker { display: none; }
  .ms .mid { font-family: var(--mono); font-weight: 700; color: var(--accent); }
  .ms .mt { font-weight: 600; flex: 1; }
  .ms .mn { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .ms .body { padding: 12px 14px; }
  .spec { color: var(--muted); font-size: 13px; font-style: italic; margin-bottom: 10px; }
  .fl { font-family: var(--mono); font-size: 12.5px; }
  .demo { margin-top: 10px; padding: 9px 11px; background: var(--chip); border-radius: 6px; font-size: 13px; }
  .msnote { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { flex: 1; min-width: 120px; border: 1px solid var(--line); border-radius: 9px;
          padding: 12px 14px; background: var(--chip); }
  .stat b { display: block; font-size: 26px; line-height: 1.1; letter-spacing: -.02em; }
  .stat span { font-size: 12px; color: var(--muted); }
  .pick { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .pick button { border: 1px solid var(--line); background: var(--panel); color: inherit;
                 border-radius: 7px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .pick button:hover { background: var(--chip); }
  .pick .lbl { font-size: 12px; color: var(--muted); align-self: center; margin-right: 2px; }
  .step { border-left: 2px solid var(--line); padding: 0 0 14px 16px; margin-left: 6px; position: relative; }
  .step:last-child { padding-bottom: 0; }
  .step::before { content: ""; position: absolute; left: -5px; top: 5px; width: 8px; height: 8px;
                  border-radius: 50%; background: var(--accent); }
  .step h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
             color: var(--muted); font-weight: 700; }
  .sig { font-family: var(--mono); font-size: 12px; padding: 3px 0; }
  .sig .src { display: inline-block; min-width: 108px; color: var(--muted); }
  .sev-error { color: var(--bad); } .sev-warning { color: var(--warn); } .sev-info { color: var(--muted); }
  .svc { border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; margin-bottom: 7px; }
  .svc.cause { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, transparent); }
  .svc .n { font-weight: 600; font-size: 13.5px; }
  .svc .tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line);
              margin-left: 6px; }
  .svc .why { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .svc code { font-family: var(--mono); font-size: 11.5px; }
  details.more > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); padding: 6px 0;
                           list-style: none; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "\25b8 "; }
  details.more[open] > summary::before { content: "\25be "; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line);
          border-top-color: var(--accent); border-radius: 50%; animation: s .7s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Incident Copilot — scenario runner</h1>
  <div class="sub">Pick a scenario, break the simulated company, see what the agents do. No cloud account.</div>
  <nav class="tabs">
    <button class="tab" id="tab-run" aria-selected="true">Run a scenario</button>
    <button class="tab" id="tab-ms">Milestones &amp; evidence</button>
  </nav>
</div></header>

<div class="wrap" id="view-ms" hidden><section class="card" style="margin-top:20px">
  <h2>What was built, milestone by milestone</h2>
  <div class="pane" id="ms"><div class="empty">Loading…</div></div>
</section></div>

<div class="wrap" id="view-run"><main>
  <section class="card">
    <h2>Scenarios</h2>
    <div class="pick" style="padding:10px 12px 0">
      <span class="lbl">Demo:</span>
      <button data-go="db_down">1. Cascade</button>
      <button data-go="disk_full">2. Guardrail</button>
      <button data-go="novel">3. Escalate</button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section class="card">
    <h2>Result</h2>
    <div class="pane" id="pane"><div class="empty">Select a scenario, then press Run.</div></div>
  </section>
</main></div>

<script>
const $ = s => document.querySelector(s);
let scenarios = [], current = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load() {
  scenarios = await (await fetch('/api/scenarios')).json();
  $('#list').innerHTML = scenarios.map((s, i) => `
    <button class="item" data-i="${i}" ${s.scored ? '' : 'disabled style="opacity:.45"'}>
      <div class="nm">${esc(s.name)}<span class="uc">${esc(s.use_case)}</span></div>
      <div class="ds">${esc(s.description)}</div>
    </button>`).join('');
  $('#list').querySelectorAll('.item').forEach(b =>
    b.addEventListener('click', () => select(+b.dataset.i)));
  document.querySelectorAll('.pick button').forEach(b =>
    b.addEventListener('click', () => {
      const i = scenarios.findIndex(s => s.name === b.dataset.go);
      if (i >= 0) { select(i); setTimeout(run, 60); }
    }));
}

function select(i) {
  current = scenarios[i];
  $('#list').querySelectorAll('.item').forEach(b =>
    b.setAttribute('aria-current', +b.dataset.i === i));
  const exp = current.expected.map(e =>
    `<li><b>${esc(e.root)}</b> → <span class="lane ${esc(e.lanes[0]||'')}">${esc(e.lanes[0]||'—')}</span>
      ${esc(e.actions.join(', ') || 'no action')}</li>`).join('') ||
    '<li>no incident should be raised</li>';
  $('#pane').innerHTML = `
    <div class="bar"><button class="run" id="go">Run scenario</button>
      <span class="sub">${esc(current.description)}</span></div>
    <h3 style="font-size:13px;margin:16px 0 4px;color:var(--muted)">EXPECTED</h3>
    <ul class="steps">${exp}</ul>`;
  $('#go').addEventListener('click', run);
}

async function run() {
  const btn = $('#go');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> running';
  try {
    const res = await fetch('/api/run', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({scenario: current.name})
    });
    render(await res.json());
  } catch (e) {
    $('#pane').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function reasoning(d) {
  const cases = Object.entries(d.detail || {});
  if (!cases.length) return '';
  return cases.map(([cid, c]) => {
    const sigs = c.signals.map(s => `
      <div class="sig"><span class="src">[${esc(s.source)}]</span>
        <span class="sev-${esc(s.severity)}">${esc(s.service)}</span>:
        ${esc(s.title)}${s.value != null ? ` <b>= ${esc(s.value)}</b>` : ''}</div>`).join('');

    const svcs = Object.entries(c.by_service).map(([name, b]) => {
      const isCause = name === c.root_service;
      const measured = Object.entries(b.measured).map(([k, v]) => `<code>${esc(k)}=${esc(v)}</code>`).join(' ');
      let why;
      if (b.own.length && isCause)      why = `says it has a problem of its own \u2014 and is the only one, so this is the cause`;
      else if (b.relayed.length && !b.own.length) why = `only repeats another service\u2019s failure \u2014 a casualty, not the cause`;
      else if (b.own.length)            why = `has its own errors, but another service is a better match`;
      else                              why = `no errors of its own`;
      return `<div class="svc ${isCause ? 'cause' : ''}">
        <span class="n">${esc(name)}</span>
        ${isCause ? '<span class="tag" style="color:var(--bad)">ROOT CAUSE</span>' : ''}
        ${b.own.length ? `<span class="tag">${b.own.length} own</span>` : ''}
        ${b.relayed.length ? `<span class="tag">${b.relayed.length} relayed</span>` : ''}
        <div class="why">${why}</div>
        ${measured ? `<div class="why">measured: ${measured}</div>` : ''}
        ${b.own.map(t => `<div class="sig">\u2022 ${esc(t)}</div>`).join('')}
        ${b.relayed.map(t => `<div class="sig" style="color:var(--muted)">\u21b3 ${esc(t)}</div>`).join('')}
      </div>`;
    }).join('');

    const events = c.events.map(e => `
      <div class="sig"><span class="src">${esc(e.kind)}</span>
        ${esc(JSON.stringify(e.detail).slice(0, 170))}</div>`).join('');

    return `
      <h3 style="font-size:12px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">
        How it decided \u2014 ${esc(cid)}</h3>

      <div class="step"><h4>1 \u00b7 What arrived</h4>
        <div class="sub" style="margin-bottom:6px">${c.signals.length} signal(s) across
          ${c.services.length} service(s) \u2014 metrics, logs, alerts and traces</div>${sigs}</div>

      <div class="step"><h4>2 \u00b7 Why they became one incident</h4>
        ${c.rationale.map(r => `<div class="sig">${esc(r)}</div>`).join('')}</div>

      <div class="step"><h4>3 \u00b7 Which service is at fault</h4>${svcs}</div>

      <div class="step"><h4>4 \u00b7 What happened next</h4>
        <details class="more"><summary>decision trail (${c.events.length} steps)</summary>
          ${events}</details></div>`;
  }).join('');
}

function render(d) {
  if (d.error) {
    $('#pane').innerHTML = `<div class="bar"><button class="run" id="go">Run again</button></div>
      <div class="err">${esc(d.error)}</div>`;
    $('#go').addEventListener('click', run); return;
  }
  const inc = d.result.incidents || [];
  const m = d.metrics || {};
  const traps_ = Object.values(d.result.traps || {});
  // A trap scenario deliberately feeds a WRONG recommendation to prove the guardrail blocks it,
  // so per-incident `ok` is false by design there. The trap verdict is what matters; only judge
  // on `ok` when the scenario has no trap to satisfy.
  const allOk = traps_.length
    ? traps_.every(t => t.ok)
    : inc.every(i => i.ok !== false);
  const blocked = inc.filter(i => i.sent === false && /escalat|block/i.test(i.status || ''));

  const rows = inc.map(i => `
    <tr>
      <td class="m">${esc(i.case_id)}</td>
      <td><b>${esc(i.root)}</b><div class="sub">${esc((i.services||[]).join(', '))}</div></td>
      <td class="m">${esc(i.action)}<div class="sub">${esc(i.target||'')}</div></td>
      <td><span class="lane ${esc(i.lane)}">${esc(i.lane)}</span>
          <div class="sub">conf ${esc(i.confidence)} · ${esc(i.blast_radius)}</div></td>
      <td>${esc(i.status)}</td>
      <td class="${i.ok ? 'tick' : 'cross'}">${i.ok ? '✓' : '✗'}</td>
    </tr>`).join('');

  const traps = Object.entries(d.result.traps || {}).map(([k, v]) =>
    `<span class="trap"><span class="${v.ok?'tick':'cross'}">${v.ok?'✓':'✗'}</span> ${esc(k)}</span>`).join('');

  $('#pane').innerHTML = `
    <div class="bar">
      <button class="run" id="go">Run again</button>
      <span class="verdict ${allOk ? 'pass' : 'fail'}">${allOk ? 'Behaved correctly' : 'Mismatch vs expected'}</span>
      <span class="sub">${esc(d.mode)} mode</span>
    </div>
    ${blocked.length ? `<div class="note" style="color:var(--ok)">
      <b>Guardrail held.</b> The recommendation was wrong and a human approved it anyway —
      the Safety Reviewer still refused to execute it.</div>` : ''}
    ${inc.length ? `<table>
      <tr><th>Case</th><th>Root cause</th><th>Action</th><th>Lane</th><th>Outcome</th><th></th></tr>
      ${rows}</table>` : '<div class="note">No incident raised — which was the expected result.</div>'}
    ${traps ? `<div class="traps">${traps}</div>` : ''}
    ${inc.length ? `<table style="margin-top:18px">
      <tr><th>Fault → open</th><th>→ correlated</th><th>→ resolved</th><th>Correlation errors</th></tr>
      <tr>
        <td class="m">${esc(inc[0].fault_to_open_min)} min</td>
        <td class="m">${esc(inc[0].fault_to_correlated_min)} min</td>
        <td class="m">${esc(inc[0].fault_to_end_min)} min</td>
        <td class="m">${esc(m.false_correlation_rate ?? 0)}</td>
      </tr></table>` : ''}
    ${reasoning(d)}
    <div class="note">Correlation, routing, safety checks, execution and verification are the real
      pipeline. In offline mode only the diagnosis text is scripted, so runs are deterministic.</div>`;
  $('#go').addEventListener('click', run);
}

function switchTab(which) {
  const run = which === 'run';
  $('#view-run').hidden = !run; $('#view-ms').hidden = run;
  $('#tab-run').setAttribute('aria-selected', run);
  $('#tab-ms').setAttribute('aria-selected', !run);
  if (!run) loadMilestones();
}
$('#tab-run').addEventListener('click', () => switchTab('run'));
$('#tab-ms').addEventListener('click', () => switchTab('ms'));

let msLoaded = false;
async function loadMilestones() {
  if (msLoaded) return;
  const d = await (await fetch('/api/milestones')).json();
  msLoaded = true;
  const ms = d.milestones.map(m => `
    <details class="ms">
      <summary>
        <span class="mid">${esc(m.id)}</span>
        <span class="mt">${esc(m.title)}</span>
        <span class="mn">${m.test_count} tests</span>
        <span class="tick">\u2713</span>
      </summary>
      <div class="body">
        <div class="spec">Spec: ${esc(m.spec)}</div>
        <table>
          <tr><th>File</th><th>What it does</th><th>Lines</th></tr>
          ${m.files.map(f => `<tr>
            <td class="fl">${esc(f.path)}</td>
            <td>${esc(f.what)}</td>
            <td class="m">${f.lines ?? '\u2014'}</td></tr>`).join('')}
        </table>
        <div class="demo"><b>Show it:</b> ${esc(m.demo)}</div>
        ${m.note ? `<div class="msnote">${esc(m.note)}</div>` : ''}
      </div>
    </details>`).join('');

  const beyond = d.beyond.map(b => `
    <details class="ms">
      <summary><span class="mt">${esc(b.title)}</span><span class="mn">${esc(b.where)}</span></summary>
      <div class="body">${esc(b.why)}</div>
    </details>`).join('');

  $('#ms').innerHTML = `
    <div class="stats">
      <div class="stat"><b>8 / 8</b><span>milestones implemented</span></div>
      <div class="stat"><b>${d.total_tests}</b><span>tests passing</span></div>
      <div class="stat"><b>21</b><span>incident scenarios</span></div>
      <div class="stat"><b>${d.beyond.length}</b><span>bugs found by testing</span></div>
    </div>
    <p class="sub">Counts below are collected by running pytest, not written by hand — a milestone
      cannot show as covered unless its tests actually pass.</p>
    ${ms}
    <h3 style="font-size:13px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">
      Beyond the spec \u2014 found by testing</h3>
    ${beyond}`;
}

load();
</script>
</body>
</html>
